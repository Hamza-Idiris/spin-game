[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

# The Supabase anon key is a public client key. Vite inlines VITE_* values
# into the JS bundle, so Netlify secrets scanning must ignore it.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
